name: Catalog and runner checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Install AgentHands regression dependencies
        run: python -m pip install "numpy>=1.24" "Pillow>=10" "requests>=2.31"
      - name: AgentHands software regression checks
        working-directory: papers/agent-hands
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
