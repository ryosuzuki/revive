[project]
name = "agent-hands"
version = "0.1.0"
description = "Spatial gesture dialogue for calibrated replay and Quest"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "requests>=2.31", "faster-whisper>=1.0"]

[project.scripts]
agent-hands = "agent_hands.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_hands"]
